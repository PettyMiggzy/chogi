*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#FF1493;
  --pink-soft:#FF69B4;
  --pink-glow:rgba(255,20,147,.5);

  --gold:#FCD34D;

html,body{overflow-x:hidden;}
body{

  color:var(--ink);position:relative;

body::before{
  content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,20,147,.18),transparent 60%),
    radial-gradient(ellipse at 100% 80%,rgba(168,85,247,.15),transparent 55%),
    radial-gradient(ellipse at 0% 60%,rgba(255,105,180,.10),transparent 50%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(255,20,147,.025) 0,rgba(255,20,147,.025) 1px,transparent 1px,transparent 4px);
}

.brand-img{

.brand-img img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family:'Bungee',sans-serif;font-size:18px;letter-spacing:2.5px;color:#fff;}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--pink);margin-top:-2px;}
.back{
  font-family:'Bungee',sans-serif;font-size:11px;letter-spacing:2px;
  text-decoration:none;color:#fff;
  padding:9px 14px;border:1.5px solid rgba(255,255,255,.18);border-radius:8px;

}
.back:hover{border-color:var(--pink);box-shadow:0 0 14px var(--pink-glow);}

/* hero */
.hero{max-width:760px;margin:36px auto 14px;padding:0 18px;text-align:center;}
.hero h1{

  filter:drop-shadow(0 0 22px var(--pink-glow));margin-bottom:12px;
}
.hero p{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.5px;color:rgba(255,233,244,.6);}

/* filters */
.filters{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:760px;margin:0 auto 22px;padding:0 18px;
}
.fpill{
  padding:9px 14px;font-family:'Bungee',sans-serif;font-size:11px;letter-spacing:2px;
  background:rgba(255,20,147,.06);border:1.5px solid rgba(255,20,147,.25);

  transition:all .15s;
}
.fpill:hover{border-color:var(--pink);color:#fff;}
.fpill.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent;box-shadow:0 0 16px var(--pink-glow);}
.fpill .count{opacity:.55;font-size:9px;margin-left:5px;}

/* grid (masonry via columns) */
.grid{
  max-width:1300px;margin:0 auto;padding:0 14px 60px;
  column-count:2;column-gap:12px;
}
@media(min-width:640px){.grid{column-count:3;}}
@media(min-width:960px){.grid{column-count:4;}}
@media(min-width:1280px){.grid{column-count:5;}}

.tile{
  display:block;break-inside:avoid;margin-bottom:12px;
  border-radius:14px;overflow:hidden;cursor:pointer;
  border:1.5px solid rgba(255,20,147,.2);background:rgba(10,1,24,.6);
  transition:transform .15s,border-color .15s,box-shadow .15s;
  position:relative;
}
.tile:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:0 8px 24px rgba(255,20,147,.22);}
.tile img,.tile video{width:100%;height:auto;display:block;}

.tile .badge.meme{color:var(--gold);border-color:rgba(252,211,77,.45);}
.tile .badge.lore{color:#22D3EE;border-color:rgba(34,211,238,.45);}
.tile .badge.family{color:var(--pink);border-color:rgba(255,20,147,.45);}
.tile .badge.action{color:#A78BFA;border-color:rgba(167,139,250,.45);}
.tile .badge.video{color:#FF4500;border-color:rgba(255,69,0,.45);}
.tile .badge.pfp{color:#fff;border-color:rgba(255,255,255,.35);}
.tile .play{

.tile .play span{

  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;

/* lightbox */
.lb{

  display:none;align-items:center;justify-content:center;

.lb.show{display:flex;}
.lb-inner{

.lb-media{

.lb-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  // ─── render tiles ───
  function render(cat){
    grid.innerHTML = '';
    ASSETS.forEach(function(a){
      if(cat!=='all' && a.cat!==cat) return;
      var tile = document.createElement('a');
      tile.className = 'tile';
      tile.href = '#';
      tile.setAttribute('data-src', a.src);
      tile.setAttribute('data-type', a.type);
      tile.setAttribute('data-label', a.label);
      tile.innerHTML =
        '<span class="badge '+a.cat+'">'+a.cat.toUpperCase()+'</span>' +
        (a.type==='image'
          ? '<img src="'+a.src+'" alt="'+a.label+'" loading="lazy">'
          : '<img src="'+a.poster+'" alt="'+a.label+'" loading="lazy"><div class="play"><span>▶</span></div>');

        e.preventDefault();
        openLB(a);
      });
      grid.appendChild(tile);
    });
  }

  // ─── filter pills ───
  function setupFilters(){
    var counts = {all:ASSETS.length};
    ASSETS.forEach(function(a){counts[a.cat]=(counts[a.cat]||0)+1;});

      var el = document.getElementById('cnt-'+k);
      if(el) el.textContent = '· '+counts[k];
    });
    document.querySelectorAll('.fpill').forEach(function(p){
      p.addEventListener('click', function(){
        document.querySelectorAll('.fpill').forEach(function(x){x.classList.remove('active');});
        p.classList.add('active');
        render(p.getAttribute('data-cat'));
      });
    });

  function openLB(a){
    lbMedia.innerHTML = '';
    if(a.type==='image'){
      var img = document.createElement('img');
      img.src = a.src; img.alt = a.label;
      lbMedia.appendChild(img);
    } else {
      var v = document.createElement('video');
      v.src = a.src; v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
      v.poster = a.poster || '';
      lbMedia.appendChild(v);
    }
    var fullURL = location.origin + a.src;
    var shareText = '$CHOGI · ' + a.label + '\n\nchogi.xyz/memes';
    lbDl.href = a.src;
    lbDl.download = a.src.split('/').pop();
    lbX.href  = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(fullURL);
    lbTG.href = 'https://t.me/share/url?url=' + encodeURIComponent(fullURL) + '&text=' + encodeURIComponent(shareText);
    lbCopy.onclick = function(){
      navigator.clipboard.writeText(fullURL).then(function(){
        showToast('LINK COPIED');
      });
    };
    lb.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeLB(){
    lb.classList.remove('show');
    lbMedia.innerHTML = '';   // stop video playback
    document.body.style.overflow = '';
  }
  lbClose.addEventListener('click', closeLB);
  lb.addEventListener('click', function(e){ if(e.target===lb) closeLB(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLB(); });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }

  // ─── init ───
  setupFilters();
  render('all');
})();
</script>
