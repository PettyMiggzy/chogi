<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chogi">
<meta name="mobile-web-app-capable" content="yes">
<title>BREACH RUN · Chogi escapes</title>
<link rel="icon" type="image/jpeg" href="/chogi.jpg">
<meta name="theme-color" content="#FF1493">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--pink:#FF1493;--purple:#A855F7;--gold:#FCD34D;--green:#4ADE80;--bg:#06000F;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'JetBrains Mono',monospace;color:#FFE9F4;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;}

.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(6,0,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,20,147,.2);z-index:10;}
.bar a{font-family:'Bungee',sans-serif;font-size:11px;letter-spacing:2px;color:rgba(255,20,147,.85);text-decoration:none;}
.bar .title{font-family:'Bungee',sans-serif;font-size:13px;letter-spacing:2.5px;color:#fff;}
.bar .score{font-family:'Bungee',sans-serif;font-size:14px;color:var(--gold);letter-spacing:1.5px;}

.game{flex:1;position:relative;overflow:hidden;cursor:pointer;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,5,35,.9),rgba(6,0,15,.95));z-index:5;padding:20px;text-align:center;}
.overlay h1{font-family:'Bungee',sans-serif;font-size:clamp(34px,9vw,56px);letter-spacing:3px;line-height:1;color:#fff;text-shadow:0 0 40px rgba(255,20,147,.5);margin-bottom:10px;background:linear-gradient(180deg,#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
.overlay .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:rgba(255,233,244,.6);margin-bottom:24px;line-height:1.7;max-width:340px;}
.overlay .sub b{color:var(--pink);}
.overlay .btn{padding:14px 28px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;font-family:'Bungee',sans-serif;font-size:13px;letter-spacing:2.5px;border-radius:12px;cursor:pointer;box-shadow:0 0 30px rgba(255,20,147,.4);}
.overlay .stats{display:flex;gap:20px;margin-bottom:24px;}
.overlay .stat{padding:10px 16px;background:rgba(255,20,147,.1);border:1px solid rgba(255,20,147,.3);border-radius:10px;}
.overlay .stat-l{font-size:9px;letter-spacing:2px;color:rgba(255,233,244,.5);}
.overlay .stat-v{font-family:'Bungee',sans-serif;font-size:20px;color:var(--gold);margin-top:3px;}
.overlay .new-best{color:var(--green);text-shadow:0 0 12px var(--green);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
.overlay.hidden{display:none;}

.tap-hint{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:'Bungee',sans-serif;font-size:14px;color:rgba(255,255,255,.7);letter-spacing:2px;animation:tapBob 1.2s ease-in-out infinite;pointer-events:none;}
@keyframes tapBob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-10px);}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <a href="/lab.html">← LAB</a>
    <div class="title">🚀 BREACH RUN</div>
    <div class="score" id="score">0m</div>
  </div>

  <div class="game" id="game">
    <canvas id="cv"></canvas>

    <div class="overlay" id="startScreen">
      <h1>BREACH RUN</h1>
      <div class="sub">Chogi is escaping the chamber.<br><b>Tap to fly upward.</b><br>Dodge clipboards. Grab pink shards. Don't touch the walls.</div>
      <button class="btn" id="startBtn">START ESCAPE</button>
    </div>

    <div class="overlay hidden" id="endScreen">
      <h1>CAUGHT</h1>
      <div class="sub" id="endMsg">the lab snagged her this time</div>
      <div class="stats">
        <div class="stat"><div class="stat-l">DISTANCE</div><div class="stat-v" id="endScore">0m</div></div>
        <div class="stat"><div class="stat-l">BEST</div><div class="stat-v" id="endBest">0m</div></div>
      </div>
      <button class="btn" id="retryBtn">RUN AGAIN</button>
    </div>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W, H, DPR = window.devicePixelRatio || 1;

  function resize(){
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // Load chogi face
  var chogiImg = new Image();
  chogiImg.src = '/chogi.jpg';

  // Game state
  var state = 'start';
  var chogi, obstacles, shards, distance, best, gravity, jumpV, scrollSpeed, particles, frame, hue;
  best = parseInt(localStorage.getItem('chogi_breach_best') || '0', 10);

  function reset(){
    chogi = { x: 0, y: 0, vy: 0, r: 24, rot: 0 };
    obstacles = [];
    shards = [];
    particles = [];
    distance = 0;
    gravity = 0.4;
    jumpV = -8;
    scrollSpeed = 2.2;
    frame = 0;
    hue = 0;
  }

  function jump(){
    chogi.vy = jumpV;
    // Spawn jet trail particles
    for(var i=0;i<6;i++){
      particles.push({
        x: chogi.x, y: chogi.y + chogi.r,
        vx: (Math.random()-0.5)*1.5,
        vy: 1 + Math.random()*2,
        life: 30 + Math.random()*20,
        maxLife: 50,
        color: Math.random()>.5 ? '#FF1493' : '#A855F7',
        r: 2 + Math.random()*3
      });
    }
  }

  function spawnObstacle(){
    // Lab equipment from above (clipboards) — gap to fly through
    var gapW = Math.max(120, 200 - distance/100);
    var gapX = 30 + Math.random() * (W - gapW - 60);
    obstacles.push({ x: 0, y: -40, w: gapX, h: 40, color: '#A855F7', kind: 'top' });
    obstacles.push({ x: gapX + gapW, y: -40, w: W - (gapX + gapW), h: 40, color: '#A855F7', kind: 'top' });
    // Random shard in the gap sometimes
    if(Math.random() > 0.35){
      shards.push({ x: gapX + gapW/2, y: -10, r: 9, rot: 0 });
    }
  }

  function update(){
    frame++;
    distance += scrollSpeed * 0.1;
    hue = (hue + 0.5) % 360;

    // Difficulty ramp
    scrollSpeed = Math.min(5.5, 2.2 + distance / 300);

    // Chogi physics (she falls down, tap pushes up — but world scrolls down so visually she's flying up)
    chogi.vy += gravity;
    chogi.y += chogi.vy;
    chogi.rot = Math.max(-0.5, Math.min(0.8, chogi.vy * 0.06));

    // Walls / floor / ceiling
    if(chogi.y - chogi.r < 0){ chogi.y = chogi.r; chogi.vy = 0; }
    if(chogi.y + chogi.r > H){ return gameOver('hit the chamber floor'); }

    // Spawn obstacles
    if(frame % Math.max(50, 110 - Math.floor(distance/3)) === 0) spawnObstacle();

    // Move obstacles down
    for(var i=obstacles.length-1;i>=0;i--){
      var o = obstacles[i];
      o.y += scrollSpeed;
      if(o.y > H + 60){ obstacles.splice(i,1); continue; }
      // Collision (Chogi is at chogi.x, chogi.y with radius)
      if(chogi.x + chogi.r > o.x && chogi.x - chogi.r < o.x + o.w &&
         chogi.y + chogi.r > o.y && chogi.y - chogi.r < o.y + o.h){
        return gameOver('caught by lab equipment');
      }
    }

    // Move shards
    for(var j=shards.length-1;j>=0;j--){
      var s = shards[j];
      s.y += scrollSpeed;
      s.rot += 0.1;
      if(s.y > H + 30){ shards.splice(j,1); continue; }
      var dx = chogi.x - s.x, dy = chogi.y - s.y;
      if(dx*dx + dy*dy < (chogi.r + s.r)*(chogi.r + s.r)){
        // Collected
        shards.splice(j,1);
        distance += 5; // bonus
        // Sparkle particles
        for(var k=0;k<10;k++){
          particles.push({ x: s.x, y: s.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life:30, maxLife:30, color:'#FCD34D', r:2+Math.random()*2 });
        }
      }
    }

    // Particles
    for(var p=particles.length-1;p>=0;p--){
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.life--;
      if(pt.life <= 0) particles.splice(p,1);
    }

    document.getElementById('score').textContent = Math.floor(distance) + 'm';
  }

  function draw(){
    // Background — gradient + drifting grid (simulates chamber moving past)
    ctx.fillStyle = '#06000F';
    ctx.fillRect(0,0,W,H);

    // Glow gradients
    var g1 = ctx.createRadialGradient(W*0.3, H*0.2, 0, W*0.3, H*0.2, W*0.6);
    g1.addColorStop(0, 'rgba(255,20,147,0.15)');
    g1.addColorStop(1, 'rgba(255,20,147,0)');
    ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);

    var g2 = ctx.createRadialGradient(W*0.7, H*0.8, 0, W*0.7, H*0.8, W*0.6);
    g2.addColorStop(0, 'rgba(168,85,247,0.18)');
    g2.addColorStop(1, 'rgba(168,85,247,0)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);

    // Drifting cyan grid
    ctx.strokeStyle = 'rgba(34,211,238,0.08)';
    ctx.lineWidth = 1;
    var gridOffset = (frame * scrollSpeed) % 60;
    for(var gy = -60 + gridOffset; gy < H; gy += 60){
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    for(var gx = 0; gx < W; gx += 60){
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }

    // Side chamber walls (decorative)
    ctx.fillStyle = 'rgba(255,20,147,0.06)';
    ctx.fillRect(0, 0, 16, H);
    ctx.fillRect(W-16, 0, 16, H);

    // Particles
    for(var i=0;i<particles.length;i++){
      var pt = particles[i];
      ctx.globalAlpha = pt.life / pt.maxLife;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Obstacles (lab clipboards from top)
    for(var o=0;o<obstacles.length;o++){
      var ob = obstacles[o];
      var grad = ctx.createLinearGradient(ob.x, ob.y, ob.x, ob.y + ob.h);
      grad.addColorStop(0, '#7C3AED');
      grad.addColorStop(1, '#A855F7');
      ctx.fillStyle = grad;
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      // Edge highlight
      ctx.fillStyle = 'rgba(34,211,238,0.5)';
      ctx.fillRect(ob.x, ob.y + ob.h - 2, ob.w, 2);
      // Decoration "wires"
      ctx.strokeStyle = 'rgba(34,211,238,0.4)';
      ctx.lineWidth = 1;
      for(var w = ob.x + 10; w < ob.x + ob.w - 10; w += 20){
        ctx.beginPath();
        ctx.moveTo(w, ob.y + 5);
        ctx.lineTo(w, ob.y + ob.h - 5);
        ctx.stroke();
      }
    }

    // Shards (collectibles)
    for(var s=0;s<shards.length;s++){
      var sh = shards[s];
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(sh.rot);
      // Glow
      ctx.shadowColor = '#FCD34D';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#FCD34D';
      ctx.beginPath();
      ctx.moveTo(0,-sh.r); ctx.lineTo(sh.r*0.7,0); ctx.lineTo(0,sh.r); ctx.lineTo(-sh.r*0.7,0); ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#FF1493';
      ctx.beginPath();
      ctx.moveTo(0,-sh.r*0.5); ctx.lineTo(sh.r*0.35,0); ctx.lineTo(0,sh.r*0.5); ctx.lineTo(-sh.r*0.35,0); ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Chogi
    ctx.save();
    ctx.translate(chogi.x, chogi.y);
    ctx.rotate(chogi.rot);
    // Glow ring
    ctx.shadowColor = '#FF1493';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#FF1493';
    ctx.beginPath(); ctx.arc(0, 0, chogi.r + 2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Image clip
    ctx.beginPath(); ctx.arc(0, 0, chogi.r, 0, Math.PI*2); ctx.clip();
    if(chogiImg.complete) ctx.drawImage(chogiImg, -chogi.r, -chogi.r, chogi.r*2, chogi.r*2);
    else { ctx.fillStyle = '#FFB6C1'; ctx.fillRect(-chogi.r,-chogi.r,chogi.r*2,chogi.r*2); }
    ctx.restore();
    // Outline
    ctx.save();
    ctx.translate(chogi.x, chogi.y);
    ctx.strokeStyle = '#FCD34D';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, chogi.r + 1, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function loop(){
    if(state === 'play'){
      update();
      draw();
      requestAnimationFrame(loop);
    }
  }

  function start(){
    resize();
    reset();
    chogi.x = W / 2;
    chogi.y = H / 2;
    state = 'play';
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function gameOver(reason){
    state = 'over';
    var d = Math.floor(distance);
    if(d > best){
      best = d;
      localStorage.setItem('chogi_breach_best', String(best));
      document.getElementById('endMsg').innerHTML = 'NEW BEST · <span style="color:#4ADE80;">'+reason+'</span>';
    } else {
      document.getElementById('endMsg').textContent = reason;
    }
    document.getElementById('endScore').textContent = d + 'm';
    document.getElementById('endBest').textContent = best + 'm';
    document.getElementById('endScreen').classList.remove('hidden');
  }

  // Input
  function tap(e){
    if(e) e.preventDefault();
    if(state === 'play') jump();
  }
  document.getElementById('game').addEventListener('pointerdown', tap);
  document.addEventListener('keydown', function(e){ if(e.code === 'Space'){ tap(e); }});

  document.getElementById('startBtn').onclick = function(e){ e.stopPropagation(); start(); };
  document.getElementById('retryBtn').onclick = function(e){ e.stopPropagation(); start(); };

  resize();
})();
</script>
<a href="https://x.com/miggzyonbase" target="_blank" rel="noopener" style="position:fixed;bottom:10px;right:10px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(6,0,15,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,20,147,.35);border-radius:20px;text-decoration:none;color:#fff;font-family:Bungee,sans-serif;font-size:9px;letter-spacing:1.5px;z-index:99;opacity:.7;transition:opacity .2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7"><span style="font-size:11px;">👑</span><span>A KING PETTY BUILD</span></a>

<script src="/js/pwa.js" defer></script>
<script src="/js/notifications.js" defer></script>
</body>
</html>
