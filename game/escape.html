<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ESCAPE 7777 · LAB BREAKOUT</title>
<meta name="description" content="ESCAPE 7777 — Chogi has broken containment. Sneak through Lab 7777 floor by floor. Top weekly score earns a free egg hatch.">
<meta name="theme-color" content="#0a0118">

<meta property="og:site_name" content="CHOGI">
<meta property="og:title" content="ESCAPE 7777 · LAB BREAKOUT">
<meta property="og:description" content="Chogi broke containment. Help her escape Lab 7777. Top weekly score wins a free hatch.">
<meta property="og:image" content="https://chogi.xyz/og-banner.jpg">
<meta property="og:url" content="https://chogi.xyz/game/escape">
<meta property="og:type" content="website">

<meta name="twitter:url" content="https://chogi.xyz/game/escape">

<link rel="icon" href="/chogi.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;background:#000;
    color:#FFE9F4;font-family:'JetBrains Mono',ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}

  /* ─── STAGE: holds canvas + cinematics + UI ─── */
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}

  /* ─── CINEMATIC OVERLAY ─── */
  .cinematic{position:fixed;inset:0;z-index:50;background:#000;
    display:none;align-items:center;justify-content:center}
  .cinematic.show{display:flex}
  .cinematic video{width:100%;height:100%;object-fit:contain;
    background:#000;max-width:100vw;max-height:100vh}
  .cinematic .skip{position:absolute;bottom:20px;right:20px;z-index:2;
    padding:8px 14px;background:rgba(10,1,24,0.7);border:1px solid rgba(255,20,147,0.4);
    color:rgba(255,233,244,0.7);font-family:'JetBrains Mono';font-size:10px;
    letter-spacing:0.18em;cursor:pointer;border-radius:6px;
    backdrop-filter:blur(4px);transition:all 0.15s}
  .cinematic .skip:hover{color:#fff;border-color:#FF1493}

  /* ─── GAME CANVAS ─── */
  #game-canvas{display:block;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#0a0118}

  /* ─── HUD ─── */
  .hud-top{position:fixed;top:0;left:0;right:0;z-index:30;
    padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(180deg,rgba(10,1,24,0.7),transparent);
    pointer-events:none;font-size:11px;letter-spacing:0.15em}
  .hud-top .grp{display:flex;gap:14px;align-items:center}
  .hud-top .stat{display:flex;flex-direction:column;gap:2px}
  .hud-top .stat span:first-child{font-size:8px;color:rgba(255,233,244,0.5);letter-spacing:0.22em}
  .hud-top .stat b{font-family:Bungee;font-size:14px;letter-spacing:0.04em;color:#FF1493}
  .hud-top .led{width:9px;height:9px;border-radius:50%;background:#6eff9c;
    box-shadow:0 0 8px #6eff9c;animation:led-pulse 1.5s ease-in-out infinite}
  @keyframes led-pulse{0%,49%{opacity:1}50%,100%{opacity:0.3}}
  .hud-top .quit{pointer-events:auto;font-size:9px;letter-spacing:0.18em;
    color:rgba(255,233,244,0.6);text-decoration:none;
    border:1px solid rgba(255,233,244,0.15);padding:5px 9px;border-radius:5px}
  .hud-top .quit:hover{color:#fff;border-color:rgba(255,20,147,0.5)}

  /* ─── MOBILE JOYSTICK ─── */
  #joystick{position:fixed;bottom:30px;left:30px;z-index:40;
    width:120px;height:120px;border-radius:50%;
    background:rgba(10,1,24,0.5);border:2px solid rgba(255,20,147,0.3);
    backdrop-filter:blur(4px);display:none;touch-action:none}
  #joystick.show{display:block}
  #joystick .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:48px;height:48px;border-radius:50%;
    background:linear-gradient(135deg,#FF1493,#A855F7);
    box-shadow:0 0 18px rgba(255,20,147,0.5),inset 0 1px 0 rgba(255,255,255,0.2);
    pointer-events:none;transition:transform 0.05s ease-out}

  /* ─── TITLE / MENU SCREEN ─── */
  .title-screen{position:fixed;inset:0;z-index:45;background:#0a0118;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    padding:24px;text-align:center}
  .title-screen.gone{display:none}
  .title-screen .stamp{font-size:10px;letter-spacing:0.32em;color:#FF1493;
    border:1px solid #FF1493;padding:4px 14px;margin-bottom:18px;
    text-shadow:0 0 8px rgba(255,20,147,0.5)}
  .title-screen h1{font-family:Bungee;font-size:48px;letter-spacing:0.06em;
    background:linear-gradient(180deg,#FFE9F4 30%,#FF1493);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;line-height:1;margin-bottom:8px;
    text-shadow:0 0 30px rgba(255,20,147,0.3)}
  .title-screen .sub{font-size:11px;color:rgba(255,233,244,0.65);
    letter-spacing:0.12em;margin-bottom:32px;line-height:1.6;max-width:380px}
  .title-screen .play-btn{font-family:Bungee;font-size:14px;letter-spacing:0.22em;
    padding:18px 44px;background:linear-gradient(135deg,#FF1493,#A855F7);
    color:#fff;border:none;border-radius:12px;cursor:pointer;
    box-shadow:0 12px 36px rgba(255,20,147,0.4);transition:all 0.15s}
  .title-screen .play-btn:hover{transform:translateY(-2px);
    box-shadow:0 16px 44px rgba(255,20,147,0.55)}
  .title-screen .controls-hint{margin-top:24px;font-size:10px;letter-spacing:0.15em;
    color:rgba(255,233,244,0.4)}
  .title-screen .home-link{position:absolute;top:20px;left:20px;font-size:10px;
    letter-spacing:0.18em;color:rgba(255,233,244,0.6);text-decoration:none;
    border:1px solid rgba(255,233,244,0.15);padding:6px 11px;border-radius:5px}
  .title-screen .home-link:hover{color:#fff;border-color:rgba(255,20,147,0.5)}

  /* boot loader */
  .boot{position:fixed;inset:0;z-index:99;background:#000;display:flex;
    align-items:center;justify-content:center;flex-direction:column;
    color:#FF1493;font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.18em;
    transition:opacity 0.5s ease-out}
  .boot.gone{opacity:0;pointer-events:none}
  .boot .spin{width:36px;height:36px;border:2px solid rgba(255,20,147,0.2);
    border-top-color:#FF1493;border-radius:50%;
    animation:spin 0.7s linear infinite;margin-bottom:14px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- BOOT -->
<div class="boot" id="boot">
  <div class="spin"></div>
  <div>▌LOADING ESCAPE 7777</div>
</div>

<!-- STAGE -->
<div id="stage">
  <canvas id="game-canvas" width="800" height="600"></canvas>
</div>

<!-- HUD -->
<div class="hud-top" id="hud" style="display:none">
  <div class="grp">
    <span class="led"></span>
    <div class="stat"><span>FLOOR</span><b id="hud-floor">01</b></div>
    <div class="stat"><span>TIME</span><b id="hud-time">0:00</b></div>
    <div class="stat"><span>SCORE</span><b id="hud-score">0</b></div>
  </div>
  <a href="/game/escape" class="quit" id="quit-btn">◀ QUIT</a>
</div>

<!-- MOBILE JOYSTICK -->
<div id="joystick"><div class="knob" id="joystick-knob"></div></div>

<!-- TITLE SCREEN -->
<div class="title-screen" id="title-screen">
  <a href="/" class="home-link">◀ HOME</a>
  <div class="stamp">▲ LAB 7777 · CONTAINMENT FAILED</div>
  <h1>ESCAPE 7777</h1>
  <div class="sub">Subject 7777 has breached containment.<br>Sneak past researchers. Find keycards. Climb floors.<br>Survive longer than every other subject this week.</div>
  <button class="play-btn" id="play-btn">▌ INITIATE BREACH</button>
  <div class="controls-hint" id="controls-hint">DESKTOP: WASD or ARROWS to move · ESC to pause</div>
</div>

<!-- CINEMATICS -->
<div class="cinematic" id="cine-intro">
  <video id="cine-intro-video" playsinline preload="auto">
    <source src="/game/cinematics/intro.mp4" type="video/mp4">
  </video>
  <button class="skip" id="cine-intro-skip">SKIP ▶</button>
</div>

<div class="cinematic" id="cine-death">
  <video id="cine-death-video" playsinline preload="auto">
    <source src="/game/cinematics/death.mp4" type="video/mp4">
  </video>
  <button class="skip" id="cine-death-skip">SKIP ▶</button>
</div>

<div class="cinematic" id="cine-victory">
  <video id="cine-victory-video" playsinline preload="auto">
    <source src="/game/cinematics/victory.mp4" type="video/mp4">
  </video>
  <button class="skip" id="cine-victory-skip">SKIP ▶</button>
</div>

<script>
(function(){
  // ─── CONSTANTS ───────────────────────────────────────────────────────────
  var TILE = 48;                    // tile size in pixels
  var ROOM_W = 16;                  // tiles wide
  var ROOM_H = 12;                  // tiles tall
  var PLAYER_SIZE = 32;
  var PLAYER_SPEED = 3.2;           // pixels per frame
  var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  // ─── STATE ───────────────────────────────────────────────────────────────
  var canvas = document.getElementById('game-canvas');
  var ctx = canvas.getContext('2d');
  var state = {
    mode: 'title',          // 'title' | 'intro' | 'playing' | 'death' | 'victory'
    floor: 1,
    score: 0,
    timeStart: 0,
    player: { x: 0, y: 0, dx: 0, dy: 0, facing: 'down' },
    room: null,             // current room layout
    keys: {},               // pressed keys
    joystick: { active: false, dx: 0, dy: 0 }
  };
  var chogiSprite = new Image();
  chogiSprite.src = '/chogi.png';

  // ─── HELPERS ─────────────────────────────────────────────────────────────
  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).classList.add('show'); }
  function hide(id){ $(id).classList.remove('show'); }

  // ─── CANVAS RESIZE ───────────────────────────────────────────────────────
  function fitCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = ROOM_W * TILE;
    canvas.height = ROOM_H * TILE;
    // CSS scale to fit window while preserving aspect
    var aspectGame = canvas.width / canvas.height;
    var aspectWin = window.innerWidth / window.innerHeight;
    if (aspectWin > aspectGame) {
      canvas.style.height = '100vh';
      canvas.style.width = (window.innerHeight * aspectGame) + 'px';
    } else {
      canvas.style.width = '100vw';
      canvas.style.height = (window.innerWidth / aspectGame) + 'px';
    }
  }
  window.addEventListener('resize', fitCanvas);

  // ─── ROOM GENERATION (v1: hand-built single test room) ──────────────────
  // 0 = floor, 1 = wall, 2 = exit door, 3 = locked door (future)
  function makeRoom(){
    var grid = [];
    for(var y = 0; y < ROOM_H; y++){
      var row = [];
      for(var x = 0; x < ROOM_W; x++){
        var isEdge = x === 0 || y === 0 || x === ROOM_W-1 || y === ROOM_H-1;
        if(isEdge){
          // exit door at top-center
          if(y === 0 && x >= 7 && x <= 8){
            row.push(2);
          } else {
            row.push(1);
          }
        } else {
          row.push(0);
        }
      }
      grid.push(row);
    }
    // a few internal pillars for visual interest
    grid[4][5] = 1; grid[4][10] = 1;
    grid[7][5] = 1; grid[7][10] = 1;
    return grid;
  }

  function spawnPlayer(){
    state.player.x = (ROOM_W / 2) * TILE;
    state.player.y = (ROOM_H - 2) * TILE;
    state.player.dx = 0; state.player.dy = 0;
    state.player.facing = 'up';
  }

  // ─── INPUT ───────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function(e){
    state.keys[e.key.toLowerCase()] = true;
    if(e.key === 'Escape' && state.mode === 'playing'){
      backToTitle();
    }
  });
  document.addEventListener('keyup', function(e){
    state.keys[e.key.toLowerCase()] = false;
  });

  // joystick (mobile)
  function initJoystick(){
    var jstick = $('joystick');
    var knob = $('joystick-knob');
    var center = { x: 0, y: 0 };
    var maxRadius = 40;

    function start(e){
      e.preventDefault();
      var t = e.touches ? e.touches[0] : e;
      var rect = jstick.getBoundingClientRect();
      center.x = rect.left + rect.width / 2;
      center.y = rect.top + rect.height / 2;
      state.joystick.active = true;
      move(e);
    }
    function move(e){
      if(!state.joystick.active) return;
      e.preventDefault();
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - center.x;
      var dy = t.clientY - center.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist > maxRadius){
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      state.joystick.dx = dx / maxRadius;
      state.joystick.dy = dy / maxRadius;
    }
    function end(){
      state.joystick.active = false;
      state.joystick.dx = 0;
      state.joystick.dy = 0;
      knob.style.transform = 'translate(-50%,-50%)';
    }

    jstick.addEventListener('touchstart', start, { passive: false });
    jstick.addEventListener('touchmove', move, { passive: false });
    jstick.addEventListener('touchend', end);
    jstick.addEventListener('touchcancel', end);
  }

  // ─── PLAYER UPDATE ───────────────────────────────────────────────────────
  function updatePlayer(){
    var dx = 0, dy = 0;
    if(state.keys['w'] || state.keys['arrowup']) dy -= 1;
    if(state.keys['s'] || state.keys['arrowdown']) dy += 1;
    if(state.keys['a'] || state.keys['arrowleft']) dx -= 1;
    if(state.keys['d'] || state.keys['arrowright']) dx += 1;
    // joystick override
    if(state.joystick.active && (Math.abs(state.joystick.dx) > 0.15 || Math.abs(state.joystick.dy) > 0.15)){
      dx = state.joystick.dx;
      dy = state.joystick.dy;
    }
    // normalize diagonal
    if(dx !== 0 && dy !== 0){
      var L = Math.sqrt(dx*dx + dy*dy);
      dx /= L; dy /= L;
    }
    var nx = state.player.x + dx * PLAYER_SPEED;
    var ny = state.player.y + dy * PLAYER_SPEED;

    // collision check (simple: see if center+halfsize crosses a wall tile)
    var half = PLAYER_SIZE / 2;
    if(!isWallAt(nx - half, state.player.y - half) && !isWallAt(nx + half - 1, state.player.y + half - 1) &&
       !isWallAt(nx + half - 1, state.player.y - half) && !isWallAt(nx - half, state.player.y + half - 1)){
      state.player.x = nx;
    }
    if(!isWallAt(state.player.x - half, ny - half) && !isWallAt(state.player.x + half - 1, ny + half - 1) &&
       !isWallAt(state.player.x + half - 1, ny - half) && !isWallAt(state.player.x - half, ny + half - 1)){
      state.player.y = ny;
    }

    // facing
    if(Math.abs(dx) > Math.abs(dy)){
      state.player.facing = dx > 0 ? 'right' : 'left';
    } else if(Math.abs(dy) > 0.1){
      state.player.facing = dy > 0 ? 'down' : 'up';
    }

    // exit door collision
    var tx = Math.floor(state.player.x / TILE);
    var ty = Math.floor(state.player.y / TILE);
    if(state.room[ty] && state.room[ty][tx] === 2){
      onExit();
    }
  }

  function isWallAt(px, py){
    var tx = Math.floor(px / TILE);
    var ty = Math.floor(py / TILE);
    if(ty < 0 || ty >= ROOM_H || tx < 0 || tx >= ROOM_W) return true;
    return state.room[ty][tx] === 1;
  }

  // ─── RENDER ──────────────────────────────────────────────────────────────
  function render(){
    // bg
    ctx.fillStyle = '#0a0118';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // tile grid (cyan glow lines)
    ctx.strokeStyle = 'rgba(0,212,255,0.07)';
    ctx.lineWidth = 1;
    for(var x = 0; x <= ROOM_W; x++){
      ctx.beginPath();
      ctx.moveTo(x * TILE, 0);
      ctx.lineTo(x * TILE, ROOM_H * TILE);
      ctx.stroke();
    }
    for(var y = 0; y <= ROOM_H; y++){
      ctx.beginPath();
      ctx.moveTo(0, y * TILE);
      ctx.lineTo(ROOM_W * TILE, y * TILE);
      ctx.stroke();
    }

    // walls + exit
    for(var y = 0; y < ROOM_H; y++){
      for(var x = 0; x < ROOM_W; x++){
        var t = state.room[y][x];
        if(t === 1){
          // wall — cyan border + dark fill
          ctx.fillStyle = '#1a0436';
          ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
          ctx.strokeStyle = '#00D4FF';
          ctx.lineWidth = 2;
          ctx.strokeRect(x*TILE+1, y*TILE+1, TILE-2, TILE-2);
        } else if(t === 2){
          // exit door — pink glowing
          var pulse = 0.5 + 0.3 * Math.sin(Date.now()/200);
          ctx.fillStyle = 'rgba(255,20,147,' + pulse + ')';
          ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
          ctx.strokeStyle = '#FF1493';
          ctx.lineWidth = 3;
          ctx.strokeRect(x*TILE+2, y*TILE+2, TILE-4, TILE-4);
          // arrow up
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 22px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('↑', x*TILE + TILE/2, y*TILE + TILE/2);
        }
      }
    }

    // player (chogi.png centered)
    if(chogiSprite.complete){
      ctx.drawImage(chogiSprite,
        state.player.x - PLAYER_SIZE/2,
        state.player.y - PLAYER_SIZE/2,
        PLAYER_SIZE, PLAYER_SIZE);
    } else {
      // fallback dot
      ctx.fillStyle = '#FF1493';
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, PLAYER_SIZE/2 - 2, 0, Math.PI*2);
      ctx.fill();
    }

    // pink shadow under player
    ctx.fillStyle = 'rgba(255,20,147,0.25)';
    ctx.beginPath();
    ctx.ellipse(state.player.x, state.player.y + PLAYER_SIZE/2 - 2, PLAYER_SIZE/3, 4, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // ─── HUD UPDATE ──────────────────────────────────────────────────────────
  function updateHud(){
    $('hud-floor').textContent = String(state.floor).padStart(2, '0');
    var t = state.timeStart ? Math.floor((Date.now() - state.timeStart) / 1000) : 0;
    var m = Math.floor(t / 60), s = t % 60;
    $('hud-time').textContent = m + ':' + String(s).padStart(2,'0');
    $('hud-score').textContent = state.score;
  }

  // ─── GAME LOOP ───────────────────────────────────────────────────────────
  var rafId = null;
  function loop(){
    if(state.mode !== 'playing'){ rafId = null; return; }
    updatePlayer();
    render();
    updateHud();
    rafId = requestAnimationFrame(loop);
  }

  // ─── FLOW: title → intro → play → death/victory ──────────────────────────
  function startNewRun(){
    state.mode = 'intro';
    $('title-screen').classList.add('gone');
    show('cine-intro');
    var v = $('cine-intro-video');
    v.currentTime = 0;
    v.play().catch(function(){});
  }
  function onIntroDone(){
    hide('cine-intro');
    state.mode = 'playing';
    state.floor = 1;
    state.score = 0;
    state.timeStart = Date.now();
    state.room = makeRoom();
    spawnPlayer();
    $('hud').style.display = 'flex';
    if(IS_TOUCH) show('joystick');
    if(!rafId) rafId = requestAnimationFrame(loop);
  }
  function onExit(){
    // for v1: exiting = floor++. Real game has procedural floors + researchers.
    state.floor++;
    state.score += 100 + Math.max(0, 60 - Math.floor((Date.now() - state.timeStart)/1000)) * 10;
    if(state.floor > 20){
      // beat the game
      onVictory();
    } else {
      state.timeStart = Date.now();
      state.room = makeRoom();
      spawnPlayer();
    }
  }
  function onDeath(){
    state.mode = 'death';
    $('hud').style.display = 'none';
    hide('joystick');
    show('cine-death');
    var v = $('cine-death-video');
    v.currentTime = 0;
    v.play().catch(function(){});
  }
  function onVictory(){
    state.mode = 'victory';
    $('hud').style.display = 'none';
    hide('joystick');
    show('cine-victory');
    var v = $('cine-victory-video');
    v.currentTime = 0;
    v.play().catch(function(){});
  }
  function backToTitle(){
    state.mode = 'title';
    $('hud').style.display = 'none';
    hide('joystick');
    hide('cine-intro');
    hide('cine-death');
    hide('cine-victory');
    $('title-screen').classList.remove('gone');
  }

  // ─── EVENTS ──────────────────────────────────────────────────────────────
  $('play-btn').addEventListener('click', startNewRun);
  $('cine-intro-skip').addEventListener('click', onIntroDone);
  $('cine-intro-video').addEventListener('ended', onIntroDone);
  $('cine-death-skip').addEventListener('click', backToTitle);
  $('cine-death-video').addEventListener('ended', backToTitle);
  $('cine-victory-skip').addEventListener('click', backToTitle);
  $('cine-victory-video').addEventListener('ended', backToTitle);
  $('quit-btn').addEventListener('click', function(e){
    e.preventDefault();
    backToTitle();
  });

  // dev hotkey: K = simulate death, V = simulate victory
  document.addEventListener('keydown', function(e){
    if(state.mode !== 'playing') return;
    if(e.key === 'k' || e.key === 'K') onDeath();
    if(e.key === 'v' || e.key === 'V') onVictory();
  });

  // ─── INIT ────────────────────────────────────────────────────────────────
  fitCanvas();
  initJoystick();

  // hide boot once chogi sprite is ready (or after timeout)
  function bootDone(){
    setTimeout(function(){
      $('boot').classList.add('gone');
      setTimeout(function(){ $('boot').remove(); }, 600);
    }, 200);
  }
  if(chogiSprite.complete) bootDone();
  else {
    chogiSprite.onload = bootDone;
    chogiSprite.onerror = bootDone;
    setTimeout(bootDone, 2000);  // fail-safe
  }

  // mobile: switch hint
  if(IS_TOUCH) $('controls-hint').textContent = 'MOBILE: drag joystick to move';
})();
</script>

</body>
</html>
